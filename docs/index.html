<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC Grantee Performances</title>
<style>
  :root {
    --bg: #faf9f6; --card: #ffffff; --ink: #1c1b1a; --muted: #6b6761; --line: #e4e0d8;
    --accent: #1f3864; --accent-ink: #ffffff; --warn-bg: #fff4d6; --warn-ink: #5c4400;
    --chip: #eef1f7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151413; --card: #1e1d1b; --ink: #ece9e3; --muted: #a09b92; --line: #33312d;
      --accent: #9db7ee; --accent-ink: #11151f; --warn-bg: #3a3112; --warn-ink: #f1dd9a; --chip: #262b36; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 18px; }
  .warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 10px 14px; margin: 0 0 16px; font-size: .9rem; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .filters input, .filters select { font: inherit; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); color: var(--ink); min-width: 0; }
  .filters input[type=search] { flex: 1 1 100%; }
  .filters select { flex: 1 1 200px; }
  .filters label.f { display: flex; align-items: center; gap: 6px; font-size: .88rem; color: var(--muted); }
  .filters label.f input { color: var(--ink); }
  .filters label.check { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card); font-size: .95rem; cursor: pointer; }
  .filters label.check input { width: 1.05rem; height: 1.05rem; margin: 0; accent-color: var(--accent); }
  .filters button { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--accent); cursor: pointer; }
  .filters button:hover, .filters button:focus-visible { background: var(--chip); }
  .filters :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .count { color: var(--muted); font-size: .85rem; margin: 6px 0 14px; }
  h2 { font-size: 1rem; margin: 26px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .ev { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 0 0 10px; }
  .row1 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .time { font-weight: 600; color: var(--accent); min-width: 5.2em; font-variant-numeric: tabular-nums; }
  .title { font-weight: 600; }
  .title a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .title a:hover, .title a:focus-visible { text-decoration-color: var(--accent); }
  .meta { color: var(--muted); font-size: .88rem; margin: 2px 0 0; }
  .desc { margin: 6px 0 0; font-size: .93rem; }
  .chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: .78rem; }
  .empty { color: var(--muted); padding: 24px 0; }
  @media (max-width: 480px) { .time { min-width: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>NYC Grantee Performances</h1>
  <p class="sub" id="sub">Loading…</p>
  <div id="warn"></div>
  <div class="filters">
    <input id="q" type="search" placeholder="Search title, venue, description" aria-label="Search">
    <select id="org" aria-label="Organization"><option value="">All organizations</option></select>
    <select id="disc" aria-label="Discipline"><option value="">All disciplines</option></select>
    <label class="f">From <input id="from" type="date"></label>
    <label class="f">To <input id="to" type="date"></label>
    <label class="check"><input id="mat" type="checkbox"> Matinees only (before 5 PM)</label>
    <button id="clear" type="button">Clear filters</button>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
  <div id="list"></div>
</div>
<script src="events.js"></script>
<script>
(function () {
  var data = null;
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
  function fmtDay(iso) {
    var p = iso.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  }
  function fmtUpdated(iso) {
    try { return new Date(iso).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }); }
    catch (e) { return ""; }
  }

  // Minutes after midnight for times like "7:30 PM"; null when the time is missing or unreadable.
  function minutes(t) {
    var m = /^\s*(\d{1,2})(?::(\d{2}))?\s*([ap])\.?m/i.exec(t || "");
    if (!m) return null;
    var h = (+m[1]) % 12;
    if (m[3].toLowerCase() === "p") h += 12;
    return h * 60 + (+(m[2] || 0));
  }
  function isMatinee(e) {
    var mins = minutes(e.time);
    return mins !== null && mins < 17 * 60;
  }

  function render() {
    var q = $("q").value.trim().toLowerCase();
    var org = $("org").value, disc = $("disc").value;
    var from = $("from").value, to = $("to").value, mat = $("mat").checked;
    var list = $("list");
    list.textContent = "";
    var shown = data.events.filter(function (e) {
      if (org && e.org !== org) return false;
      if (disc && e.discipline !== disc) return false;
      if (from && e.date < from) return false;
      if (to && e.date > to) return false;
      if (mat && !isMatinee(e)) return false;
      if (q) {
        var hay = (e.title + " " + e.location + " " + e.description + " " + e.org + " " + e.genre).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    $("count").textContent = shown.length + " of " + data.events.length + " performances";
    if (!shown.length) { list.appendChild(el("p", "empty", "No performances match these filters.")); return; }

    var lastDate = "";
    shown.forEach(function (e) {
      if (e.date !== lastDate) { list.appendChild(el("h2", "", fmtDay(e.date))); lastDate = e.date; }
      var card = el("div", "ev");
      var r1 = el("div", "row1");
      r1.appendChild(el("span", "time", e.time || "Time TBA"));
      var t = el("span", "title");
      var u = safeUrl(e.url);
      if (u) { var a = el("a", "", e.title); a.href = u; a.target = "_blank"; a.rel = "noopener"; t.appendChild(a); }
      else t.textContent = e.title;
      r1.appendChild(t);
      card.appendChild(r1);
      card.appendChild(el("p", "meta", e.org + (e.location ? " · " + e.location : "")));
      if (e.description) card.appendChild(el("p", "desc", e.description));
      var chips = el("div", "chips");
      chips.appendChild(el("span", "chip", e.discipline));
      if (e.genre) chips.appendChild(el("span", "chip", e.genre));
      if (e.notes) chips.appendChild(el("span", "chip", e.notes));
      card.appendChild(chips);
      list.appendChild(card);
    });
  }

  function fill(sel, values) {
    values.forEach(function (v) { var o = el("option", "", v); o.value = v; sel.appendChild(o); });
  }

  // events.js (loaded above) works from a local file or a website; events.json is the fallback.
  var source = window.EVENTS
    ? Promise.resolve(window.EVENTS)
    : fetch("events.json", { cache: "no-cache" }).then(function (r) { return r.json(); });

  source.then(function (d) {
    data = d;
    $("sub").textContent = "Performances from each organization’s own website, " + d.window.start + " to " + d.window.end +
      ". Last updated " + fmtUpdated(d.generated_at) + ".";
    if (d.warnings && d.warnings.length) {
      var w = el("div", "warn");
      w.textContent = "Some listings may be out of date: " + d.warnings.join(" ");
      $("warn").appendChild(w);
    }
    fill($("org"), d.orgs);
    fill($("disc"), Array.from(new Set(d.events.map(function (e) { return e.discipline; }))).sort());
    $("from").min = $("to").min = d.window.start;
    $("from").max = $("to").max = d.window.end;
    ["q", "org", "disc", "from", "to", "mat"].forEach(function (id) {
      $(id).addEventListener("input", render);
      $(id).addEventListener("change", render);
    });
    $("clear").addEventListener("click", function () {
      $("q").value = ""; $("org").value = ""; $("disc").value = "";
      $("from").value = ""; $("to").value = ""; $("mat").checked = false;
      render();
    });
    render();
  }).catch(function () {
    $("sub").textContent = "Could not load the event data. Make sure events.js is in the same folder as this page.";
  });
})();
</script>
</body>
</html>
